name: 编一个我自己的 Rikka

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出我的补丁文件
        uses: actions/checkout@v4
        with:
          path: mine

      - name: 下载官方源码（锁定 2.5.3，含子模块）
        uses: actions/checkout@v4
        with:
          repository: rikkahub/rikkahub
          ref: 6adc0cf184b784c68b8737d4e55daabe4cfbcde7
          path: src
          submodules: recursive

      - name: 打上美化补丁（不适用就跳过）
        run: |
          cd src
          if [ -f ../mine/beautify.patch ]; then
            git apply -v ../mine/beautify.patch || echo "补丁不适用这个版本，先编原版"
          else
            echo "没有 beautify.patch，先编原版"
          fi

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 web-ui 依赖
        working-directory: src/web-ui
        run: pnpm install --frozen-lockfile

      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 造一个占位 google-services.json
        run: |
          echo '{"project_info":{"project_number":"123456789012","project_id":"rikka-local","storage_bucket":"rikka-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:aaaaaaaaaaaaaaaaaaaaaa","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:bbbbbbbbbbbbbbbbbbbbbb","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > src/app/google-services.json

      - name: 取回固定的签名证书（缓存）
        id: keystore
        uses: actions/cache@v4
        with:
          path: ci.jks
          key: rikka-fixed-keystore-v1

      - name: 第一次才生成 keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore ci.jks -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yg123456 -keypass yg123456 \
            -dname "CN=Rikka Bei, OU=YG, O=YG, L=CN, S=CN, C=CN"

      - name: 写入签名配置
        run: |
          printf 'storeFile=%s/ci.jks\nstorePassword=yg123456\nkeyAlias=ci\nkeyPassword=yg123456\n' "$GITHUB_WORKSPACE" > src/local.properties
          ls -l ci.jks

      - name: 编译 release 版
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: rikka-253-release
          path: src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
